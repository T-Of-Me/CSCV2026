services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${CHROMATIC_PORT:-8080}:8080"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - edge-cache:/var/cache/nginx
    depends_on:
      - web

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      PORT: "3000"
      RENDERER_URL: http://renderer:5000
      BOT_URL: http://bot:3001
      BOT_SHARED_SECRET: local-bot-channel-4c6316b40c # change this to a secure random value in production
      ADMIN_TOKEN: local-admin-cookie-8fe136ca98 # change this to a secure random value in production
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      - renderer

  renderer:
    build:
      context: ./renderer
    restart: unless-stopped
    expose:
      - "5000"

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    environment:
      PORT: "3001"
      APP_ORIGIN: http://edge:8080
      BOT_SHARED_SECRET: local-bot-channel-4c6316b40c # change this to a secure random value in production
      ADMIN_TOKEN: local-admin-cookie-8fe136ca98 # change this to a secure random value in production
    depends_on:
      - edge

volumes:
  edge-cache:
  uploads:
